modules:
- module: xrobot-org/BMI088
  id: bmi088
  args:
  - accl_cs: ACCL_CS
  - gyro_cs: GYRO_CS
  - gyro_int: GYRO_INT
  - spi: spi1
  - heater_pwm: pwm_tim10_ch1
  - database: database
  - ramfs: ramfs
  - param:
      gyro_freq: BMI088::GyroFreq::GYRO_2000HZ_BW532HZ
      accl_freq: BMI088::AcclFreq::ACCL_1600HZ
      gyro_range: BMI088::GyroRange::DEG_2000DPS
      accl_range: BMI088::AcclRange::ACCL_24G
      rotation: '{1.0f, 0.0f, 0.0f, 0.0f}'
      pid_param: '{.k = 1.0f, .p = .35f, .i = 0, .d = 0, .i_limit = 0, .out_limit
        = 0, .cycle = false}'
      gyro_topic_name: '"bmi088_gyro"'
      accl_topic_name: '"bmi088_accl"'
      target_temperature: 45
      task_stack_depth: 2048
- module: xrobot-org/MadgwickAHRS
  id: ahrs
  args:
  - ramfs: ramfs
  - param:
      beta: 0.05
      gyro_topic_name: '"bmi088_gyro"'
      accl_topic_name: '"bmi088_accl"'
      quaternion_topic_name: '"ahrs_quaternion"'
      euler_topic_name: '"ahrs_euler"'
      task_stack_depth: 2048
- module: QDU-Robomaster/RMMotor
  id: motor_yaw
  args:
  - can_bus: SysID::Observe(can1)
  - param:
      model: RMMotor::Model::MOTOR_GM6020
      reverse: true
      feedback_id: 517
- module: QDU-Robomaster/SysID
  id: g_sysid
  args:
  - motor: motor_yaw
  - can_bus: can1
  - param:
      feedback_id: 517
      feedback_torque_sign: -1.0
      gyro_topic_name: '"bmi088_gyro"'
      euler_topic_name: '"ahrs_euler"'
      gyro_axis: 2
      gyro_sign: -1.0
      pitch_zero: 0.0
      min_position: -2.18
      max_position: -1.19
      max_travel: 0.06
      amplitude: 0.07
      kp: 2.0
      kd: 0.12
      torque_limit: 0.2
      tx_id: 510
      tx_byte_offset: 0
      tx_encoding: SysId::CanCommandObserver::Encoding::SIGNED16
      tx_torque_scale: (-0.741f * 3.0f / 16384.0f)
      tx_torque_bias: 0.0
      torque_constant: 0.741
      seed: 44257
      task_stack_depth: 2048
settings:
  monitor_sleep_ms: 1000
